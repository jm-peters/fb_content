name: SmartSort Facebook First-Comment Queue

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartsort-facebook-history
  cancel-in-progress: false

jobs:
  post-due-comments:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API client dependency
        run: python -m pip install "requests>=2.32.3"

      - name: Post comments for published Page content
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python fb_comment_queue.py

      - name: Save updated comment queue
        run: |
          git config user.name "smartsort-bot"
          git config user.email "bot@smartsort.tech"
          git add history.json
          git diff --staged --quiet || git commit -m "chore: update Facebook comment queue"
          git push

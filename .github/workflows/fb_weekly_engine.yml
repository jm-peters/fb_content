name: SmartSort Facebook Weekly Engine

on:
  schedule:
    # Runs every Sunday at 15:00 UTC (6:00 PM EAT / Nairobi time)
    # Schedules Monday through Sunday posts ahead of the new week
    - cron: "0 15 * * 0"
  workflow_dispatch: # Allows manual 1-click test runs anytime from GitHub Actions tab

permissions:
  contents: write # Needed to commit updated history.json back to the repo

concurrency:
  group: smartsort-facebook-history
  cancel-in-progress: false

jobs:
  generate-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg and system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run SmartSort Weekly Facebook Content Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          missing=()
          for name in GEMINI_API_KEY PIXABAY_API_KEY FB_PAGE_ID FB_PAGE_ACCESS_TOKEN; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]})); then
            echo "::error::GitHub Actions did not provide these secrets: ${missing[*]}"
            echo "Check the secret names and, for organization secrets, confirm this repository is allowed to access them."
            exit 1
          fi
          python main.py

      - name: Commit updated history.json
        run: |
          git config user.name "smartsort-bot"
          git config user.email "bot@smartsort.tech"
          git add history.json
          git diff --staged --quiet || git commit -m "chore: update weekly FB post history & insights"
          git push

name: SmartSort Facebook Daily Engine

on:
  schedule:
    # 4:00 PM EAT, two to three hours before the weekday publish slots.
    - cron: "0 13 * * 1-5"
    # 9:00 AM EAT for Saturday's 11:00 AM publish slot.
    - cron: "0 6 * * 6"
    # 3:00 PM EAT for Sunday's 5:00 PM publish slot.
    - cron: "0 12 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartsort-facebook-history
  cancel-in-progress: false

jobs:
  generate-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg and system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run SmartSort Daily Facebook Content Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          missing=()
          for name in GEMINI_API_KEY PIXABAY_API_KEY FB_PAGE_ID FB_PAGE_ACCESS_TOKEN; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]})); then
            echo "::error::GitHub Actions did not provide these secrets: ${missing[*]}"
            echo "Check the secret names and, for organization secrets, confirm this repository is allowed to access them."
            exit 1
          fi
          python main.py

      - name: Commit updated history
        if: always()
        run: |
          git config user.name "smartsort-bot"
          git config user.email "bot@smartsort.tech"
          git add history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist daily content history"
            git push
          fi
